<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2E4A3C">
<meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="data:,">
<title>BE-examen drillen</title>
<style>
:root{--groen:#2E4A3C;--licht:#A6C284;--oranje:#E8895F;--bg:#FBFAF6;--tekst:#1f2a24;--grijs:#6b7570;--rood:#c0392b;--goed:#2e7d4f;--kaart:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tekst);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Open Sans",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--groen);color:#fff;padding:10px 14px calc(10px) 14px;padding-top:max(10px,env(safe-area-inset-top))}
header .rij{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700}
header .klaar{font-size:13px;opacity:.9;text-align:right}
.balk{height:6px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;overflow:hidden}
.balk>i{display:block;height:100%;background:var(--licht);width:0;transition:width .4s}
main{max-width:720px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--grijs)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.aan{color:var(--groen);font-weight:700}
.kaart{background:var(--kaart);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--grijs);margin-bottom:8px;gap:8px}
.bakjes i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ddd;margin-left:3px}
.bakjes i.v{background:var(--licht)}
.vraag{font-size:18px;font-weight:600;margin:4px 0 12px}
.opties{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;border:2px solid #d8ddd9;background:#fff;border-radius:10px;padding:12px;font-size:16px;color:var(--tekst)}
.opt:active{background:#f1f4f0}
.opt.goed{border-color:var(--goed);background:#e8f5ec}
.opt.fout{border-color:var(--rood);background:#fbeaea}
.opt.gekozen{border-color:var(--groen);background:#eef3ec}
.opt[disabled]{opacity:1}
.opt .nr{display:inline-block;min-width:24px;height:24px;border-radius:12px;background:var(--groen);color:#fff;text-align:center;font-size:13px;line-height:24px;margin-right:8px}
.knop{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;background:var(--groen);color:#fff;margin:4px 6px 4px 0}
.knop.licht{background:#e7ece5;color:var(--groen)}
.knop.oranje{background:var(--oranje)}
.knop.klein{padding:8px 12px;font-size:14px}
.knop[disabled]{opacity:.45}
.knoppen{margin-top:12px}
textarea,input[type=number],input[type=text]{width:100%;font-size:16px;border:2px solid #d8ddd9;border-radius:10px;padding:10px;font-family:inherit;background:#fff}
textarea{min-height:120px}
.mic{background:var(--oranje)}
.mic.op{background:var(--rood);animation:puls 1.2s infinite}
@keyframes puls{50%{opacity:.6}}
.uitslag{margin-top:14px;border-radius:12px;padding:12px 14px}
.uitslag.goed{background:#e8f5ec;border-left:5px solid var(--goed)}
.uitslag.fout{background:#fbeaea;border-left:5px solid var(--rood)}
.uitslag.bijna{background:#fff4e6;border-left:5px solid var(--oranje)}
.uitslag h3{margin:0 0 6px;font-size:17px}
.uitslag ul{margin:6px 0;padding-left:20px}
.uitslag li.ok{color:var(--goed)}
.uitslag li.mis{color:var(--rood)}
.uitleg{margin-top:8px}
.bron{font-size:13px;margin-top:8px;color:var(--grijs)}
.bron a{color:var(--groen)}
.tag{display:inline-block;font-size:11px;background:#eef1ee;color:var(--grijs);border-radius:6px;padding:1px 6px;margin-left:4px}
.fig{width:100%;max-height:300px;display:block;margin:4px auto 12px;background:#f4f6f2;border-radius:10px}
.fig text{font-family:inherit}
.lbl{font-size:11px;fill:#444}
.onderwerp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.onderwerp:last-child{border:0}
.onderwerp .naam{flex:1}
.onderwerp .naam small{display:block;color:var(--grijs)}
.mini{width:90px;height:8px;background:#e5e8e4;border-radius:4px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--goed)}
.chip{display:inline-block;background:#eef3ec;color:var(--groen);border-radius:20px;padding:4px 10px;font-size:13px;margin:0 6px 6px 0;border:1px solid #d5e0d0}
.chip.aan{background:var(--groen);color:#fff}
details{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:10px;padding:0 14px}
summary{padding:14px 0;font-weight:700;cursor:pointer}
details ul{margin-top:0;padding-left:20px}
details li{margin-bottom:6px}
.leeg{text-align:center;color:var(--grijs);padding:30px 10px}
.klein{font-size:13px;color:var(--grijs)}
.reeks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stap{background:#eef3ec;border-radius:8px;padding:6px 10px;font-size:14px}
.ai{background:#f3f0fa;border-left:5px solid #6a5acd;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
</style>
</head>
<body>
<header>
 <div class="rij"><h1>BE-examen drillen</h1><div class="klaar" id="klaar">Examenklaar 0%</div></div>

<script>

/* ============ BRONNEN ============ */
const VIDS={
 "W5VBro9Ilpw":"BE-rijbewijs theorie-uitleg",
 "8l5VoG34rEI":"Kogeldruk",
 "GhnmAxt-bVE":"Bonusvraag paardentrailer",
 "9Rg9GQ8AQJY":"Controlevragen aanhanger (short)",
 "cBME75Arkis":"Aanhanger aan- en afkoppelen",
 "XNkuVIdhvXY":"Fatale fout bij aankoppelen (short)",
 "9yvkQriHuXE":"Spiegelen met een BE-combinatie",
 "nA4JQGroLbU":"Wat is uitzwaai?",
 "Fd8KfItsXYg":"Kruispunten en rotondes met aanhanger",
 "sCSEpBgSr88":"Snelweg in- en uitvoegen met aanhanger",
 "gNk4tG9kI-A":"Driebaans snelweg met aanhanger (short)",
 "MZ989c1qygQ":"Recht achteruit rijden met aanhanger",
 "K-dbXvmgBAQ":"Halve draai met aanhanger",
 "1QLpVbB0RjI":"Bochtje achteruit / keren via een zijstraat",
 "eUWqinAvBVw":"CBR: zo gaat het BE-examen"
};
const CBR="https://www.cbr.nl/nl/rijbewijs-halen/aanhangwagen/praktijkexamen-auto-met-aanhangwagen/hoe-gaat-het-praktijkexamen-auto-met-aanhangwagen";
const RVV="https://wetten.overheid.nl/BWBR0004825/";

/* ============ ONDERWERPEN ============ */
const TOPICS=[
 {id:"regels",naam:"Regels, maten en gewichten",v:["W5VBro9Ilpw","gNk4tG9kI-A"],leer:[
  "Personenauto + aanhanger: samen max <b>18 m</b>. Met een bedrijfsauto/bus: <b>18,75 m</b>. Aanhanger zelf max <b>12 m</b>.",
  "Max breedte <b>2,55 m</b>, max hoogte <b>4 m</b>.",
  "Waarom je maten kennen? Vanwege verbodsborden: lengte (draai niet te maken), hoogte (tunnel, viaduct), breedte (bv. afgezette linkerbaan in Duitsland).",
  "Zegt de examinator 'er wordt geen verbodsbord aangegeven'? Dan is er geen beperking en mag je gewoon doorrijden.",
  "BE-combinatie: max 3.500 kg auto + 3.500 kg aanhanger = <b>7.000 kg</b>.",
  "BE nodig als de <b>toegestane maximummassa (TMM)</b> van auto + aanhanger samen boven 3.500 kg komt (bij een aanhanger zwaarder dan 750 kg). De politie kijkt naar de kentekenbewijzen, niet naar de weegbrug.",
  "Snelheid met aanhanger: snelweg en autoweg <b>90</b>, gewone weg buiten de kom <b>80</b>, binnen de kom <b>50</b>.",
  "3 of meer rijstroken in jouw richting: alleen de <b>twee meest rechtse</b>. Reden: je lengte (wet: langer dan 7 m; de video zegt 7,5 m), niet je snelheid.",
  "Gewicht kennen vanwege bruggen met gewichtsbeperking. Wegen kan bij een weegbrug, milieustraat, stenenhandel of veehouderij (even bellen)."]},
 {id:"rekenen",naam:"Kentekenbewijs en rekenen",v:["W5VBro9Ilpw"],leer:[
  "<b>Massa rijklaar</b> = wat het voertuig leeg weegt.",
  "<b>Laadvermogen</b> = TMM min massa rijklaar.",
  "Mag de auto de aanhanger trekken? Vergelijk de TMM van de aanhanger met het <b>max trekgewicht geremd</b> van de auto.",
  "Past de lading niet in de aanhanger? Verdeel: wat over is mag in de auto, tot het laadvermogen van de auto.",
  "Geremde aanhanger herken je aan een <b>eigen kentekenbewijs/kenteken</b> en een <b>oploopreminrichting</b>.",
  "Je rijdt het examen <b>geladen</b>. De examinator kan vragen: wat wegen we nu, wat mogen we samen wegen (TMM samen), hoe lang/breed/hoog zijn we."]},
 {id:"laden",naam:"Kogeldruk en beladen",v:["8l5VoG34rEI","GhnmAxt-bVE"],leer:[
  "<b>Kogeldruk</b>: hoeveel druk de trekhaak mag hebben (sticker/typeplaatje trekhaak). <b>Lastende koppeling</b>: hoeveel de koppeling van de aanhanger mag hebben.",
  "Houd altijd de <b>laagste</b> van de twee aan en blijf ongeveer <b>10% onder</b> dat maximum.",
  "Lading te ver <b>achter</b> = te weinig kogeldruk = aanhanger gaat slingeren.",
  "Lading te ver <b>voor</b> = te veel kogeldruk = neus van de auto komt omhoog, minder grip op de voorwielen, meer slipgevaar.",
  "Lading in het midden (boven de as), zwaar onderin, en altijd <b>vastzetten</b> zodat hij niet schuift.",
  "Paardentrailer met één paard: laad het paard <b>links</b>. Wegen lopen bol naar rechts, je wijkt bij tegenliggers uit naar de berm: rechts geeft meer kantelgevaar."]},
 {id:"remmen",naam:"Remsystemen",v:["W5VBro9Ilpw"],leer:[
  "Drie remmen aan de dissel: <b>losbreekreminrichting</b> (kabel), <b>handrem</b>, <b>oploopreminrichting</b>.",
  "Losbreekkabel: schiet de koppeling los van de trekhaak, dan trekt de kabel de handrem aan. Daarna <b>breekt de kabel af</b>, zo is het bedoeld. Nooit vervangen door een ketting.",
  "Stofhoes (balg) om de oploopremstang: houdt vuil en regen weg, zodat het vet niet wegspoelt. Scheurtjes? Zo snel mogelijk vervangen."]},
 {id:"controle",naam:"Controle en examenverloop",v:["9Rg9GQ8AQJY","eUWqinAvBVw"],leer:[
  "Controle aanhanger: geen <b>ijs/sneeuw op het dak</b> (jij bent aansprakelijk), geen <b>loshangende kabels</b> onder, <b>bandenprofiel minimaal 1,6 mm</b> (ezelsbrug: scooter op je 16e), geen schade aan de zijkant van de band, genoeg lucht, <b>wielbouten</b> niet geroest. Plus (algemeen): verlichting werkt.",
  "Het examen duurt <b>55 minuten</b>, de rit ongeveer 35 minuten. Ogentest: kenteken lezen op ongeveer 25 m.",
  "Vooraf vragen over de kentekenbewijzen, het beladen en het aankoppelen. Je instructeur mag je bij het aankoppelen aanwijzingen geven.",
  "Je doet <b>twee bijzondere verrichtingen</b>; de examinator kijkt dan buiten mee, ook of je beide spiegels gebruikt en het verkeer in de gaten houdt.",
  "Meenemen: identiteitsbewijs, rijbewijs B en de bevestiging van het examen."]},
 {id:"aankoppelen",naam:"Aankoppelen",v:["cBME75Arkis","XNkuVIdhvXY"],leer:[
  "Examinator laat je een stukje naar voren rijden en 'uit het lood' draaien. Dan: ramen omlaag, alarmlichten aan, achteruit; aan beide kanten even veel afstand; laatste meter heel rustig. Instructeur mag gidsen.",
  "1. Slot van de koppeling eraf (knopje in, hand eronder).",
  "2. Neuswiel laten zakken tot de koppeling op de kogel valt: <b>klik</b>.",
  "3. Controle: neuswiel terugdraaien (omhoog). Komt de auto mee omhoog, dan zit hij vast. Indicator op groen. Groen maar geen klik? Op de dissel drukken/staan tot hij klikt.",
  "4. <b>Losbreekkabel</b> om: gaat er daarna iets mis, dan trekt hij de handrem aan.",
  "5. Stekker erin en verlichting controleren (algemeen). Stap 4 en 5 mogen in willekeurige volgorde.",
  "6. Neuswiel helemaal omhoog: gleufje naar de zijkant, wiel recht omhoog, met je voet tegenhouden (anders tegen de stang).",
  "7. Handrem eraf en controleren dat hij echt los is.",
  "Bewijs aan de examinator dat hij vastzit: auto kwam mee omhoog, indicator groen, handgreep vergrendeld."]},
 {id:"afkoppelen",naam:"Afkoppelen",v:["cBME75Arkis"],leer:[
  "1. Verlichting uit (voorkomt kortsluiting) en motor uit.",
  "2. Aanhanger <b>naar achteren duwen</b> en vasthouden tot de oploopremstang helemaal uit is (geen bumperschade). <b>Vergeet je dit: gezakt.</b>",
  "3. <b>Handrem erop</b>: nu kan hij niet wegrollen. <b>Vergeet je dit: gezakt.</b>",
  "4. Neuswiel laten zakken tot op de grond, met je voet tegenhouden.",
  "5. Stekker (stroom) eruit.",
  "6. Losbreekkabel eraf. Stap 5 en 6 mogen in willekeurige volgorde.",
  "7. Koppeling ontgrendelen en van de kogel halen."]},
 {id:"spiegelen",naam:"Spiegelen, bochten en uitzwaai",v:["9yvkQriHuXE","nA4JQGroLbU"],leer:[
  "Rechtsaf: <b>linkerspiegel, rechterspiegel, rechts naast je, richting aan</b>. Linksaf: rechterspiegel, linkerspiegel, links naast je, richting aan. (Eerst de andere kant, dan de kant waar je heen gaat.)",
  "<b>Vóór de bocht de buitenkant</b> kijken (uitzwaai, wie zit naast me), <b>in de bocht de binnenkant</b> (inloop, stoep, wie zit achter me).",
  "<b>Inloop</b>: de aanhanger snijdt de bocht af naar binnen. <b>Uitzwaai</b>: de achterkant van de aanhanger zwaait bij het insturen naar de andere kant. Stuur je naar rechts, dan gaat de kar even naar links.",
  "Doe alsof de kar 1 tot 2 m uitzwaait; de examinator weet niet hoe groot jouw aanhanger is.",
  "Geen binnenspiegel (dichte aanhanger): stop altijd <b>in een rechte lijn</b> zodat je in beide spiegels langs de combinatie kijkt. Het middenvak bij linksaf niet gebruiken.",
  "Aan de kant zetten: ver genoeg doortrekken zodat de aanhanger recht staat.",
  "Rechte weg: afwisselend links en rechts spiegelen, de aanhanger blijven volgen.",
  "Kruispunt naderen: tempo eruit, rollend aankomen. Hoe langzamer je nadert, hoe sneller je misschien door kunt."]},
 {id:"kruispunt",naam:"Kruispunten en rotondes",v:["Fd8KfItsXYg"],leer:[
  "Ezelsbrug: <b>20 m vóór het eerste obstakel</b> (zebrapad, fietspad) <b>20 km/u op de teller</b>.",
  "Niet alleen de voorkant moet ervoor, ook de <b>achterkant van de aanhanger</b>.",
  "Twee of meer auto's: gewoon stoppen.",
  "Rol je al en komt er ineens iemand? Liever <b>stilzetten</b> (ook op een leeg fietspad/zebrapad) dan gas bijgeven. 9 van de 10 die zakken geven op dat moment gas.",
  "Oranje licht: je remweg is langer, dus eerder remmen, en tijdens het remmen achter je kijken.",
  "Achter een voorganger stoppen: je ziet nog de onderkant van zijn banden.",
  "Rijd zo dicht mogelijk bij de max (47 in een 50-zone is prima). Te langzaam vindt de examinator hinderlijk.",
  "Drempels: afremmen (denk aan een heet bekertje koffie).",
  "Scherpe bocht: wachten tot er ruimte is, ruim insturen (als het spelletje Snake).",
  "Kun je de draai niet maken? Stop recht ervoor, laat passeren, stel ruim op.",
  "Meest gemaakte fouten: uitritten en rotondes, te snel naderen en niet langs de kar kijken."]},
 {id:"snelweg",naam:"Snelweg in- en uitvoegen",v:["sCSEpBgSr88","gNk4tG9kI-A"],leer:[
  "Invoegen met 60 = gezakt. Snelheid maken, richting 80 of meer, zo dicht mogelijk bij de snelheid van het verkeer (max 90).",
  "Invoegen (naar links): rechterspiegel, linkerspiegel, links naast je (schouder), richting aan, rustig opschuiven. Gebruik je invoegstrook: je bent lang.",
  "Daarna afstand maken: minimaal 2 seconden, met aanhanger liever 3. Tellen vanaf een vast punt: 21-22-23.",
  "Uitvoegen: richting aan ongeveer 300 m van tevoren, aan laten tot het laatste pijltje. Vóór de bocht buitenkant, in de bocht binnenkant.",
  "3 of meer stroken: alleen de twee meest rechtse."]},
 {id:"recht",naam:"Recht achteruit",v:["MZ989c1qygQ"],leer:[
  "Meetopdracht: recht achteruit tot een punt of obstakel (denk aan je caravan tot het hek op de camping).",
  "Stilstaan op ongeveer <b>1 m van de stoeprand</b>. Alarmlichten aan, ramen omlaag.",
  "Beide spiegels: houd de afstand aan beide kanten gelijk. Kleine stuurbewegingen.",
  "Denk je dat je er bijna bent: stilzetten (mag meters ervoor), uitstappen en meten.",
  "Meten: vanaf het achterlicht stappen of <b>stoepbanden tellen</b> tot het punt. Pionnetje mag. Kies een oriëntatiepunt en rijd tot je gezicht naast het pionnetje is."]},
 {id:"halvedraai",naam:"Halve draai (keren)",v:["K-dbXvmgBAQ"],leer:[
  "Halve draai = U-bocht <b>vooruit</b>, in één keer naar je eigen weghelft.",
  "Je mag alle ruimte gebruiken: kruispunt, bedrijventerrein, parkeerplaats.",
  "Jij zoekt de plek, de examinator geeft de opdracht.",
  "Tempo eruit, rechterspiegel, linkerspiegel, links naast je, richting links, achterom kijken. Vrij? Niet stoppen, doorrijden.",
  "Kijk tijdens het draaien langs/achter de kar. Daarna zo snel mogelijk weer op tempo."]},
 {id:"zijstraat",naam:"Bocht achteruit / keren via zijstraat",v:["1QLpVbB0RjI"],leer:[
  "Doel: keren met een bochtje achteruit. Doe het <b>linksom</b>: de bocht zit aan jouw kant.",
  "Rijd over het kruispunt naar de <b>verkeerde (linker) weghelft</b>, voorbij de zijstraat, en stop op ongeveer <b>1 m van de stoeprand</b> (dichterbij = haakser).",
  "Zijstraat alleen rechts? Rij rechts de zijstraat in, zet hem aan de verkeerde kant en maak het bochtje linksom.",
  "Alarmlichten aan, ramen omlaag. Je ziet in de rechterspiegel wat eraan komt.",
  "Zo langzaam mogelijk, voet op de rem. Vloeiend is niet vlot.",
  "Houd de kar op ongeveer 1 m van de bocht. Komt hij te dichtbij: <b>stuur naar het gevaar toe</b>, dan gaat de kar ervan af. De kar reageert een paar seconden later: vroeg en klein corrigeren.",
  "Komt er verkeer: stilzetten en laten passeren.",
  "Staat hij recht in de straat: alarmlichten uit, richting aan, kijken, wegrijden naar de examinator."]},
 {id:"achteruit",naam:"Achteruit sturen en parkeren",v:[],leer:[
  "<span class='tag'>algemene kennis, niet uit de video's</span>",
  "Achteruit stuur je 'omgekeerd': stuur je de auto naar links, dan gaat de achterkant van de aanhanger naar rechts.",
  "Trucje: hand <b>onderaan</b> het stuur. Beweeg je hand naar de kant waar de aanhanger heen moet.",
  "Wordt de hoek tussen auto en aanhanger te groot (scharen), dan kom je er achteruit niet meer uit: stop en rijd een stukje vooruit om recht te trekken.",
  "Inparkeren: eerst de combinatie recht, dan langzaam, kleine correcties, uitstappen om te kijken mag. Gebruik de ruimte die er is."]}
];
const TNAAM=Object.fromEntries(TOPICS.map(t=>[t.id,t.naam]));

/* ============ FIGUREN (SVG) ============ */
const S=(w,h,b)=>`<svg class="fig" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const T=(x,y,s,o="")=>`<text x="${x}" y="${y}" class="lbl" ${o}>${s}</text>`;
const pijl=`<defs><marker id="pk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="pb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E4A3C"/></marker></defs>`;
function autoBoven(x,y,w,h,kleur="#3b6ea5"){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${kleur}"/>`}
const FIG={

const ITEMS=[];
const add=o=>{ITEMS.push(o);return o};
const mc=(id,t,q,opts,why,x={})=>add({id,t,type:"mc",q,opts,why,...x});      // opts[0] is goed, wordt gehusseld
const tf=(id,t,q,waar,why,x={})=>add({id,t,type:"mc",q,opts:waar?["Waar","Niet waar"]:["Niet waar","Waar"],vast:true,why,...x});
const ord=(id,t,q,steps,why,x={})=>add({id,t,type:"order",q,steps,why,...x});
const sp=(id,t,q,points,why,x={})=>add({id,t,type:"speak",q,points,why,...x}); // points: [label, [alternatieven]]
const num=(id,t,q,ans,why,x={})=>add({id,t,type:"num",q,ans,why,...x});
const gen=(id,t,fn,x={})=>add({id,t,type:"gen",fn,...x});
const V=(v,s,t)=>({v,s,t});
const rnd=(a,b,st=1)=>a+st*Math.floor(Math.random()*((b-a)/st+1));
const kg=n=>n.toLocaleString("nl-NL")+" kg";

mc("l5","laden","De lading ligt helemaal achterin de aanhanger. Wat gebeurt er?",["Te weinig kogeldruk: de aanhanger gaat slingeren","Te veel kogeldruk: de neus van de auto komt omhoog","Niets, zolang het vastzit","De aanhanger remt harder"],"Te veel achterin = te weinig kogeldruk. De aanhanger wordt onrustig en gaat slingeren.",{fig:["combi",{lading:"achter"}],src:V("8l5VoG34rEI","achterzijde",52)});

mc("l7","laden","Waar leg je de lading het liefst?",["In het midden, boven de as, zwaar onderin, en vastgezet","Zo ver mogelijk voorin","Zo ver mogelijk achterin","Maakt niet uit als de klep dicht is"],"In het midden boven de as, en alles vastzetten zodat het niet schuift (anders verandert de kogeldruk onderweg).",{fig:["combi",{lading:"midden"}],src:V("8l5VoG34rEI","vast te zetten",129)});
tf("l8","laden","Als de lading mooi in het midden staat, hoef je hem niet vast te zetten.",false,"Niet waar: lading die verschuift verandert de kogeldruk. Altijd vastzetten.",{src:V("8l5VoG34rEI","vast te zetten",129)});
mc("l9","laden","Paardentrailer voor twee paarden, je hebt er één bij je. Waar laad je het paard?",["Links","Rechts","Maakt niet uit","In het midden, schot eruit"],"Links. Wegen lopen bol naar rechts, en bij een tegenligger op een smal weggetje moet je de berm in. Een paard rechts geeft meer kantelgevaar.",{src:V("GhnmAxt-bVE","linkerzijde",8)});

mc("b1","remmen","Welke drie remmen/remonderdelen zitten aan de dissel?",["Losbreekreminrichting, handrem, oploopreminrichting","ABS, handrem, motorrem","Schijfrem, trommelrem, handrem","Losbreekkabel, neuswiel, stofhoes"],"Losbreekreminrichting (de kabel), de handrem en de oploopreminrichting.",{src:V("W5VBro9Ilpw","drie verschillende remsystemen",280)});

mc("b3","remmen","Wat doet de losbreekkabel?",["Schiet de koppeling los van de trekhaak, dan trekt hij de handrem van de aanhanger aan","Hij houdt de aanhanger vast aan de auto","Hij zorgt voor stroom naar de lampen","Hij zet de oploopremmen vast tijdens het rijden"],"Komt de koppeling los van de trekhaak, dan trekt de kabel de handrem aan, zodat de aanhanger tot stilstand komt.",{src:V("W5VBro9Ilpw","handrem",286)});

mc("b6","remmen","Waarom zit er een stofhoes (balg) om de oploopreminrichting?",["Om vuil en regen buiten te houden, zodat het vet niet wegspoelt","Voor de mooiheid","Om de kabels bij elkaar te houden","Om de kogeldruk te meten"],"De oploopremstang moet gesmeerd blijven. De stofhoes beschermt het vet tegen vuil en regen.",{src:V("W5VBro9Ilpw","stofhoes",356)});
mc("b7","remmen","Je ziet scheurtjes in de stofhoes. Wat doe je?",["Zo snel mogelijk vervangen","Niets, dat is normaal","Er tape omheen doen en zo laten","Hem weghalen"],"Beschadigd = zo snel mogelijk vervangen, anders komt er vuil en water bij en spoelt het vet weg.",{src:V("W5VBro9Ilpw","beschadigd",387)});
sp("b8","remmen","De examinator wijst de losbreekkabel aan: 'Wat is dit, wat doet het, en wat gebeurt er daarna mee?'",[

mc("s8","spiegelen","Linksaf, je wacht op tegenliggers. Er is een middenvak tussen de rijbanen. Welke stand is goed?",["B: recht op de weg blijven","A: schuin het middenvak in","Allebei goed","Achter de stopstreep schuin zetten"],"Met de combinatie stop je kaarsrecht en gebruik je het middenvak niet. Dan kun je in beide spiegels langs de combinatie kijken.",{fig:"stoppen",src:V("9yvkQriHuXE","middenvak",227)});
mc("s9","spiegelen","Waarom moet je de combinatie altijd recht stilzetten?",["Je hebt geen binnenspiegel; recht kun je in beide buitenspiegels langs de combinatie kijken","Omdat dat mooier staat","Omdat de handrem anders niet werkt","Om de kogeldruk goed te houden"],"Met een dichte aanhanger heb je geen binnenspiegel. Alleen als je recht staat zie je langs de combinatie wat ernaast zit.",{src:V("9yvkQriHuXE","binnenspiegel",139)});
mc("s10","spiegelen","Je zet de combinatie aan de kant. Waar let je op?",["Ver genoeg doortrekken zodat de aanhanger recht staat","Zo snel mogelijk stoppen","Met de aanhanger schuin naar de stoep","Zo dicht mogelijk achter een geparkeerde auto"],"Ver genoeg doortrekken, zodat de aanhanger recht en stabiel staat en je langs de combinatie kunt kijken.",{src:V("9yvkQriHuXE","ver genoeg doortrekt",149)});
mc("s11","spiegelen","Hoeveel moet je er bij het afslaan van uitgaan dat je kar uitzwaait?",["Ongeveer 1 tot 2 meter; de examinator weet niet hoe groot jouw aanhanger is","Niets, een kleine aanhanger zwaait niet uit","10 cm","5 meter"],"Doe alsof hij 1 tot 2 m uitzwaait. Het examen is algemeen; de examinator wil zien dat je er rekening mee houdt.",{src:V("Fd8KfItsXYg","een meter naar buiten",285)});
mc("s12","spiegelen","Hoe nader je een kruispunt waar je moet afslaan?",["Tempo eruit en rollend naderen; hoe langzamer je nadert, hoe eerder je door kunt","Op snelheid blijven en pas op het laatst remmen","Altijd volledig stoppen","Gas geven om voor het verkeer te zijn"],"Rollend naderen geeft tijd om te kijken. Vaak hoef je dan niet te stoppen.",{src:V("9yvkQriHuXE","hoe langzamer ik nader",168)});
mc("s13","spiegelen","Op een rechte weg, hoe spiegel je?",["Afwisselend links en rechts, en de aanhanger blijven volgen","Alleen in de binnenspiegel","Alleen links","Alleen voor een bocht"],"Gewoon blijven spiegelen, links en rechts. Je zit er voor de aanhanger: laat zien dat je hem volgt.",{src:V("9yvkQriHuXE","rechte wegen",62)});

/* --- Kruispunt --- */
mc("x1","kruispunt","Wat is de ezelsbrug voor rotondes en kruispunten met een zebrapad?",["20 m vóór het eerste obstakel 20 km/u op de teller","50 m ervoor stoppen","30 km/u tot op de rotonde","10 m ervoor 10 km/u"],"20 m voor het eerste obstakel (zebrapad, fietspad) 20 op de teller. Dan kun je nog stoppen zonder noodstop.",{fig:"rotonde",src:V("Fd8KfItsXYg","20 op de teller",121)});
mc("x2","kruispunt","Je rolt naar de rotonde en ziet twee of meer auto's aankomen. Wat doe je?",["Stoppen","Gas bijgeven en ertussen","Doorrollen en hopen","Toeteren"],"Twee of meer auto's: gewoon stoppen en wachten.",{src:V("Fd8KfItsXYg","twee of meerdere auto",605)});
mc("x3","kruispunt","Je rolt al de rotonde op en ineens verschijnt er een auto. Met de achterkant van de aanhanger kom je er niet meer voor. Wat doe je?",["Stilzetten, ook al sta je dan op een (leeg) fietspad of zebrapad","Gas bijgeven: de bus komt er nog voor","Doorrollen en de auto laten remmen","Achteruit terugrijden"],"Stilzetten is de keuze die de examinator wil zien. Negen van de tien die zakken geven op dat moment gas: de bus komt ervoor, de aanhanger niet.",{src:V("Fd8KfItsXYg","negen van de 10",622)});
mc("x4","kruispunt","Je gaat een voorrangsweg op. Wat moet er allemaal voor het verkeer langs zijn?",["De hele combinatie, ook de achterkant van de aanhanger","Alleen de voorkant van de auto","Alleen de auto","Alleen de neus van de aanhanger"],"Niet alleen de voorkant: ook de achterkant van de aanhanger moet er voor de andere auto zijn.",{src:V("Fd8KfItsXYg","ook de achterzijde",147)});
mc("x5","kruispunt","Het verkeerslicht springt op oranje. Wat is anders met een aanhanger?",["Je remweg is langer: eerder remmen, en tijdens het remmen achter je kijken","Je mag door oranje rijden","Niets","Je moet altijd vol remmen"],"Met een aanhanger is je remweg langer. Rem op tijd en houd in de spiegels in de gaten wat er achter je zit.",{src:V("Fd8KfItsXYg","oranje",155)});
mc("x6","kruispunt","Je stopt achter een andere auto. Hoeveel ruimte laat je?",["Je ziet nog de onderkant van zijn banden","Een halve meter","Je bumper raakt bijna","Tien meter"],"Zie je de onderkant van zijn banden, dan kun je er omheen als hij kapot gaat.",{src:V("Fd8KfItsXYg","onderkant van zijn banden",168)});
mc("x7","kruispunt","In een 50-zone rijd je met de combinatie...",["Zo dicht mogelijk bij 50, bijvoorbeeld 47","Rustig 30, dat is veiliger","Precies 50 of iets erboven","40, met aanhanger mag niet harder"],"Probeer net onder het maximum te blijven. Rijd je veel te langzaam, dan vindt de examinator je hinderlijk.",{src:V("Fd8KfItsXYg","47 is gewoon prima",379)});
mc("x8","kruispunt","Hoe neem je een verkeersdrempel?",["Afremmen, alsof er een heet bekertje koffie staat","Op snelheid blijven","Gas geven vlak voor de drempel","Schuin erover"],"Rustig afremmen: denk aan een heet bekertje koffie dat niet mag omvallen.",{src:V("Fd8KfItsXYg","bekertje koffie",768)});
mc("x9","kruispunt","Een scherpe bocht naar rechts in een smalle straat. Wat doe je?",["Wachten tot er ruimte is en de bocht zo ruim mogelijk insturen","Zo krap mogelijk de bocht om","Over de stoep","Snel doorrijden"],"Wachten op ruimte, ruim insturen, de kar volgen. 'Als het spelletje Snake.'",{src:V("Fd8KfItsXYg","sneake",454)});
mc("x10","kruispunt","Je kunt de draai op een kruispunt niet in één keer maken. Wat doe je?",["Recht stoppen ervoor, het verkeer laten passeren, dan ruim opstellen","Half de bocht in en wachten","Achteruit rijden","Over de stoep"],"Stop recht, zodat je langs de kar kunt kijken. Laat passeren, stel ruim op en ga dan.",{src:V("Fd8KfItsXYg","stop ik beter hier recht",262)});
mc("x11","kruispunt","Wat zijn volgens de instructeur de meest gemaakte fouten?",["Te snel naar uitritten en rotondes, en niet langs de kar kijken","Te langzaam op de snelweg","Verkeerd parkeren","De radio aan"],"Uitritten en rotondes: te snel ernaartoe en niet langs de kar kijken of er iets naast zit.",{src:V("Fd8KfItsXYg","meest gemaakte fout",574)});
mc("x12","kruispunt","Kruispunt met weinig zicht naar rechts. Hoe nader je?",["Snelheid zo ver eruit dat je de straat in kunt kijken voor je beslist; ook kijken wie naast je zit","Op snelheid blijven, je hebt voorrang","Toeteren en doorrijden","Volledig stoppen en 10 seconden wachten"],"Pas je snelheid aan je zicht aan, en vergeet niet wat er naast de kar rijdt.",{src:V("Fd8KfItsXYg","weinig zicht",2)});

/* --- Snelweg --- */
mc("w1","snelweg","Met welke snelheid probeer je in te voegen?",["Zo dicht mogelijk bij de snelheid van het verkeer, minstens richting 80","Met 60, rustig aan","Met 50","Met 120 om snel ertussen te zijn"],"Invoegen met 60 = gezakt. Maak snelheid, richting 80 en meer (max 90), zo dicht mogelijk bij het verkeer.",{src:V("sCSEpBgSr88","met 60 invoegt",27)});
ord("w2","snelweg","Invoegen op de snelweg (naar links). Zet in de goede volgorde.",["Rechterspiegel","Linkerspiegel","Links naast je kijken (schouder)","Richting aan","Rustig opschuiven"],"Rechterspiegel, linkerspiegel, links naast je, richting aan en rustig opschuiven terwijl je blijft kijken.",{src:V("sCSEpBgSr88","links naast je richting aan",40)});

mc("w6","snelweg","Hoe lang blijft je richtingaanwijzer aan bij het uitvoegen?",["Tot het laatste pijltje / de uitvoegstrook echt begonnen is","Drie keer knipperen","Tot je de snelweg niet meer ziet","Tot het eerste kruispunt"],"Aan laten tot het laatste pijltje, dan uit.",{src:V("sCSEpBgSr88","laatste pijltje",78)});

mc("w8","snelweg","Waarom gebruik je de invoegstrook goed?",["Je bent lang; andere weggebruikers hebben tijd nodig om je te zien en te reageren","Om de examinator te laten wachten","Om brandstof te sparen","Dat hoeft niet"],"Je bent lang. Begin op tijd met kijken en gebruik je strook, zodat anderen je zien en ruimte kunnen maken.",{src:V("sCSEpBgSr88","je bent lang",125)});
tf("w9","snelweg","Op een driebaansweg mag je met de combinatie de linkerbaan gebruiken om een vrachtwagen in te halen.",false,"Niet waar: alleen de twee meest rechtse banen.",{fig:["snelweg",{n:3}],src:V("W5VBro9Ilpw","meest rechter mag",187)});

/* --- Recht achteruit --- */
mc("ra1","recht","Wat is het doel van 'recht achteruit'?",["Een meetopdracht: recht achteruit tot een punt of obstakel, zonder het te raken","Zo snel mogelijk achteruit","Achteruit om een hoek","Achteruit inparkeren tussen twee auto's"],"Het is een meetopdracht. Denk aan je caravan op de camping tot het hek: niet ertegen, maar ook niet 4 m ervoor.",{src:V("MZ989c1qygQ","meetopdracht",2)});
mc("ra2","recht","Hoe ver van de stoeprand stel je je op?",["Ongeveer 1 meter","Tegen de stoeprand","3 meter","Midden op de weg"],"Ongeveer een meter. Hoe dichterbij, hoe moeilijker je het jezelf maakt.",{src:V("MZ989c1qygQ","meterruimte",23)});
ord("ra3","recht","Recht achteruit. Zet in de goede volgorde.",["Stilstaan op ongeveer 1 m van de stoeprand","Alarmlichten aan en ramen omlaag","Achteruit; in beide spiegels de afstand gelijk houden","Ruim voor het punt stilzetten","Uitstappen en uitmeten (stoepbanden tellen, pion)","Achteruit tot je bij je oriëntatiepunt bent"],"Opstellen, alarmlichten en ramen, achteruit met beide spiegels, op tijd stilzetten, uitstappen en meten, dan het laatste stuk.",{src:V("MZ989c1qygQ","alarmlichten aanzet",37)});
mc("ra4","recht","Hoe houd je de combinatie recht?",["In beide spiegels de afstand gelijk houden en met kleine stuurbewegingen corrigeren","Alleen in de linkerspiegel kijken","Grote stuurbewegingen","Over je schouder door de achterruit"],"Houd aan beide kanten de afstand gelijk. Kleine stuurbewegingen.",{src:V("MZ989c1qygQ","kleine stuurbeweging",97)});
mc("ra5","recht","Hoe meet je hoe ver je nog moet?",["Vanaf het achterlicht stappen of stoepbanden tellen tot het punt, en een pion als oriëntatiepunt neerzetten","Op gevoel","De examinator vragen","Op de camera kijken"],"Loop naar de achterkant, tel stoepbanden tot het punt, en kies een oriëntatiepunt (pion). Rijd tot je gezicht naast de pion is.",{fig:"recht",src:V("MZ989c1qygQ","stoepbanden",150)});
tf("ra6","recht","Bij recht achteruit mag je uitstappen om te kijken, en een pionnetje gebruiken.",true,"Waar. Uitstappen en meten mag, een pionnetje ook.",{src:V("MZ989c1qygQ","pionnetje",133)});
num("ra7","recht","Je telt 8 stoepbanden van je achterlicht tot het putje. Hoeveel meter is dat ongeveer?",8,"Een stoepband is ongeveer 1 m. 8 stoepbanden = ongeveer 8 m.",{tol:0,unit:"m",src:V("MZ989c1qygQ","betekent 8m",153)});

mc("z1","zijstraat","Welke kant op maak je het bochtje achteruit volgens de instructeur?",["Linksom: de bocht zit aan jouw kant","Rechtsom","Maakt niet uit","Altijd de kant die de examinator zegt"],"Linksom. Je kijkt zelf naar de bocht en houdt in de rechterspiegel het verkeer in de gaten.",{src:V("1QLpVbB0RjI","linksom",17)});
mc("z2","zijstraat","Waar zet je de combinatie neer voor het bochtje achteruit (zijstraat links)?",["B: voorbij de zijstraat, op de linkerweghelft, ongeveer 1 m van de stoep","A: voor de zijstraat, rechts","C: voorbij de zijstraat, rechts","Midden op het kruispunt"],"Je rijdt over het kruispunt naar de 'verkeerde' kant (B). Daar zie je in de rechterspiegel wat eraan komt en kijk je zelf naar de bocht.",{fig:["zijstraat",{toonNa:true}],src:V("1QLpVbB0RjI","verkeerde kant",43)});
mc("z3","zijstraat","Waarom ga je op de verkeerde (linker) weghelft staan?",["In de rechterspiegel zie je al het verkeer dat eraan komt, en de bocht zit aan jouw kant","Omdat het daar breder is","Omdat de examinator daar staat","Om sneller klaar te zijn"],"Zo houd je in de rechterspiegel alles in de gaten en kun je over je schouder de bocht volgen.",{src:V("1QLpVbB0RjI","rechterspiegel alles",54)});
mc("z4","zijstraat","Het kruispunt heeft alleen rechts een zijstraat. Wat doe je?",["Rechts de zijstraat in, aan de verkeerde kant wegzetten en linksom achteruit","Dan maak je het rechtsom","Je weigert de opdracht","Je rijdt door naar een ander kruispunt"],"Rij de zijstraat rechts in, zet hem aan de verkeerde kant en maak toch het boogje linksom.",{src:V("1QLpVbB0RjI","alleen maar rechts een zijstraat",73)});
mc("z5","zijstraat","Waarom stel je op ongeveer 1 m van de stoeprand op?",["Hoe dichterbij de stoep, hoe haakser (moeilijker) de bocht","Zodat fietsers erlangs kunnen","Dat is de wet","Zodat de examinator kan instappen"],"Sta je te dichtbij, dan wordt de bocht te haaks.",{src:V("1QLpVbB0RjI","haakser",246)});
mc("z6","zijstraat","De aanhanger komt te dicht bij de stoep in de bocht. Hoe stuur je?",["Naar het gevaar toe: dan gaat de kar ervan af","Van het gevaar af","Stuur recht houden en gas geven","Vol insturen"],"Achteruit stuur je 'naar het probleem toe'; de kar gaat dan van de stoep af.",{src:V("1QLpVbB0RjI","naar het gevaar toe",311)});
mc("z7","zijstraat","Het CBR wil het 'vloeiend' zien. Wat betekent dat?",["Rustig en gelijkmatig, zo langzaam mogelijk; vloeiend is niet vlot","Zo snel mogelijk","Zonder één keer te remmen","In één stuurbeweging"],"Vloeiend betekent niet vlot. Zo langzaam mogelijk achteruit rollen, voet op de rem.",{src:V("1QLpVbB0RjI","vloeiend",292)});
mc("z8","zijstraat","Hoe snel reageert de aanhanger op een kleine stuurbeweging?",["Een paar seconden later; dus vroeg en klein corrigeren","Meteen","Nooit","Pas na 10 meter"],"De kar reageert een paar seconden later. Hoe later je reageert, hoe meer je moet sturen.",{src:V("1QLpVbB0RjI","paar seconden later",303)});

ord("z11","zijstraat","Keren via een zijstraat (bochtje achteruit linksom). Zet in de goede volgorde.",["Spiegels, richting aan, naar de linkerweghelft voorbij de zijstraat","Stoppen op ongeveer 1 m van de stoeprand","Alarmlichten aan en ramen omlaag","Langzaam achteruit, kar op ongeveer 1 m van de bocht","Komt er verkeer: stilzetten en laten passeren","Staat hij recht in de straat: alarmlichten uit","Richting aan, kijken en wegrijden"],"Opstellen links voorbij de zijstraat, 1 m van de stoep, alarmlichten, langzaam achteruit met 1 m afstand, wachten op verkeer, alarmlichten uit, richting aan en weg.",{src:V("1QLpVbB0RjI","gevarenlichten uit",398)});

const MIN=60e3,UUR=60*MIN,DAG=24*UUR;
const BEHEERST=3; // bakje 3+ = je snapt het
function grade(id,goed){const r=rec(id),nu=Date.now(),nieuw=r.seen===0;r.seen++;ST.n++;
 if(goed){r.ok++;r.box=nieuw?2:Math.min(5,r.box+1);
  if(r.box===1){r.dueN=ST.n+5;r.dueT=0}
  else if(r.box===2){r.dueN=ST.n+12;r.dueT=nu+10*MIN}
  else if(r.box===3){r.dueN=ST.n+20;r.dueT=nu+3*UUR}
  else if(r.box===4){r.dueN=0;r.dueT=nu+DAG}
  else{r.dueN=0;r.dueT=nu+2*DAG}}
 else{r.fout++;r.box=0;r.dueN=ST.n+3;r.dueT=0}
 r.last=nu;ST.log.push({t:nu,id,g:goed?1:0});if(ST.log.length>3000)ST.log=ST.log.slice(-3000);save();}
function pool(){return ITEMS.filter(i=>!ST.focus.length||ST.focus.includes(i.t))}
function topicStats(tid){const its=ITEMS.filter(i=>i.t===tid);let m=0,s=0,pts=0;its.forEach(i=>{const r=ST.items[i.id];if(r&&r.seen){s++;pts+=Math.min(r.box,BEHEERST);if(r.box>=BEHEERST)m++}});return{tot:its.length,beheerst:m,gezien:s,pct:Math.round(100*pts/(its.length*BEHEERST))}}
function totaal(){let pts=0,m=0;ITEMS.forEach(i=>{const r=ST.items[i.id];if(r){pts+=Math.min(r.box,BEHEERST);if(r.box>=BEHEERST)m++}});return{pct:Math.round(100*pts/(ITEMS.length*BEHEERST)),beheerst:m,tot:ITEMS.length}}
let vorige=null;
function kiesVolgende(){const P=pool(),nu=Date.now();
 const due=P.filter(i=>{const r=ST.items[i.id];return r&&r.seen&&ST.n>=r.dueN&&nu>=r.dueT&&i.id!==vorige});
 const wankel=P.filter(i=>{const r=ST.items[i.id];return r&&r.seen&&r.box<2});
 const pick=a=>{a.sort((x,y)=>{const rx=ST.items[x.id],ry=ST.items[y.id];return rx.box-ry.box||rx.dueN-ry.dueN||Math.random()-.5});return a[0]};
 if(due.length)return pick(due);
 const nieuw=P.filter(i=>!ST.items[i.id]||!ST.items[i.id].seen);
 if(nieuw.length&&wankel.length<6){
  const per={};nieuw.forEach(i=>{(per[i.t]=per[i.t]||[]).push(i)});
  const tids=Object.keys(per).sort((a,b)=>{const sa=topicStats(a),sb=topicStats(b);return sa.gezien/sa.tot-sb.gezien/sb.tot||TOPICS.findIndex(t=>t.id===a)-TOPICS.findIndex(t=>t.id===b)});
  return per[tids[0]][0];}
 const rest=P.filter(i=>i.id!==vorige&&ST.items[i.id]&&ST.items[i.id].seen);
 if(wankel.length){const w=wankel.filter(i=>i.id!==vorige);if(w.length)return pick(w)}
 if(!rest.length)return P[0]||null;
 rest.sort((x,y)=>{const rx=ST.items[x.id],ry=ST.items[y.id];return rx.box-ry.box||(rx.dueT-ry.dueT)||Math.random()-.5});
 return rest[0];}

function norm(s){return(" "+s+" ").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/(\d),(\d)/g,"$1 $2").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ")}
// Zoekt een alternatief (een of meer woorddelen, dicht bij elkaar) vanaf positie 'van'; geeft de positie of -1.
function zoek(tekst,alt,van=0){const sq=norm(tekst).replace(/ /g,""),p0=norm(alt).trim().split(" ").filter(Boolean);if(!p0.length)return -1;
 let from=van;
 while(true){const i=sq.indexOf(p0[0],from);if(i<0)return -1;let ok=true,na=i+p0[0].length;
  for(let k=1;k<p0.length;k++){const j=sq.indexOf(p0[k],na);if(j<0||j>na+25){ok=false;break}na=j+p0[k].length}
  if(ok)return i;from=i+1}}
function eerste(tekst,alts,van=0){let pos=-1;alts.forEach(a=>{const p=zoek(tekst,a,van);if(p>=0&&(pos<0||p<pos))pos=p});return pos}
function lokaalNakijken(item,tekst){let res,volgordeOk=true,omgedraaid=[];
 if(item.ordered){let laatst=-1;res=[];
   // Stappen in dezelfde vrij-groep mogen onderling wisselen: ze zoeken allemaal vanaf hetzelfde startpunt.
   const blokken=[];item.points.forEach((_,i)=>{const g=(item.vrij||[]).find(g=>g.includes(i));if(g&&g[0]!==i)return;blokken.push(g||[i])});
   blokken.forEach(blok=>{const start=laatst+1;let hoogste=laatst;blok.forEach(i=>{const [label,alts]=item.points[i];const p=eerste(tekst,alts,start);
    if(p>=0){hoogste=Math.max(hoogste,p);res[i]={label,pos:p};return}
    const ergens=eerste(tekst,alts,0);if(ergens>=0){volgordeOk=false;omgedraaid.push(label)}res[i]={label,pos:ergens}});laatst=hoogste})}
 else res=item.points.map(([label,alts])=>({label,pos:eerste(tekst,alts,0)}));
 const gevonden=res.filter(r=>r.pos>=0).length,min=item.min||item.points.length;
 const goed=gevonden>=min&&volgordeOk;const bijna=!goed&&gevonden>=Math.ceil(min*0.6);
 return{res,gevonden,min,volgordeOk,omgedraaid,goed,bijna}}

  $("#volgende").onclick=()=>{grade(it.id,oordeel);if(examen){examen.uitslag.push({id:it.id,q:it.q,g:oordeel});examen.i++}toonOefenen()};
  const o=$("#omdraaien");if(o)o.onclick=()=>{oordeel=!oordeel;opt.bijna=false;teken()};
  $("#volgende").scrollIntoView({behavior:"smooth",block:"center"})};teken()}
function startExamen(){const open=shuffle(ITEMS.filter(i=>i.type==="speak"));examen={lijst:open.slice(0,8),i:0,uitslag:[]};toonOefenen()}
function toonExamenUitslag(){const g=examen.uitslag.filter(x=>x.g).length;app.innerHTML=`<div class="kaart"><h2 style="margin-top:0">Examinatorvragen: ${g} van ${examen.uitslag.length} goed</h2><ul>${examen.uitslag.map(x=>`<li style="color:${x.g?"var(--goed)":"var(--rood)"}">${x.g?"✓":"✗"} ${esc(x.q)}</li>`).join("")}</ul><button class="knop" id="terug">Verder drillen</button></div>`;examen=null;$("#terug").onclick=toonOefenen;kopBalk()}

function toonStand(){stopSpraak();kopBalk();const t=totaal();const vandaag=new Date().toDateString();const lv=ST.log.filter(l=>new Date(l.t).toDateString()===vandaag);const okv=lv.filter(l=>l.g).length;
 let h=`<div class="kaart"><div class="vraag" style="margin:0">Examenklaar: ${t.pct}%</div><div class="klein">${t.beheerst} van ${t.tot} vragen beheerst (3 keer goed, met tijd ertussen). Vandaag ${lv.length} antwoorden, ${lv.length?Math.round(100*okv/lv.length):0}% goed.</div></div>`;
 h+=`<div class="kaart"><div class="meta"><b style="color:var(--tekst)">Onderwerpen</b><span>tik om alleen dat te oefenen</span></div>`;
 TOPICS.forEach(tp=>{const s=topicStats(tp.id);const aan=ST.focus.includes(tp.id);h+=`<div class="onderwerp"><div class="naam">${esc(tp.naam)}<small>${s.beheerst}/${s.tot} beheerst · ${s.gezien} gezien</small></div><div class="mini"><i style="width:${s.pct}%"></i></div><button class="chip ${aan?"aan":""}" data-f="${tp.id}">${aan?"✓ focus":"focus"}</button></div>`});
 h+=`<div class="knoppen"><button class="knop" id="oefenFocus">${ST.focus.length?"Oefen selectie":"Oefen alles"}</button>${ST.focus.length?`<button class="knop licht" id="wisF">Selectie wissen</button>`:""}</div></div>`;
 const zwak=ITEMS.map(i=>({i,r:ST.items[i.id]})).filter(x=>x.r&&x.r.fout).sort((a,b)=>b.r.fout-a.r.fout||a.r.box-b.r.box).slice(0,8);
 if(zwak.length)h+=`<div class="kaart"><b>Lastigste vragen</b><ul>${zwak.map(x=>`<li>${esc(x.i.type==="gen"?TNAAM[x.i.t]+" (rekensom)":x.i.q)} <span class="klein">${x.r.fout}× fout${x.r.box>=BEHEERST?" · nu beheerst":""}</span></li>`).join("")}</ul></div>`;
 app.innerHTML=h;
 app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=b.dataset.f;ST.focus=ST.focus.includes(f)?ST.focus.filter(x=>x!==f):[...ST.focus,f];save();toonStand()});
 $("#oefenFocus").onclick=()=>tab("oefen");const w=$("#wisF");if(w)w.onclick=()=>{ST.focus=[];save();toonStand()}}
function toonLeer(){stopSpraak();let h=`<p class="klein">De kern per onderwerp, uit de video's van Verkeersopleider (instructeur Emre), aangevuld met de CBR-site en de wet. Tik een video aan om hem te bekijken.</p>`;
 TOPICS.forEach(tp=>{h+=`<details><summary>${esc(tp.naam)}</summary><ul>${tp.leer.map(l=>`<li>${l}</li>`).join("")}</ul>${tp.v.length?`<div class="bron">Video: ${tp.v.map(v=>`<a href="https://www.youtube.com/watch?v=${v}" target="_blank" rel="noopener">${esc(VIDS[v])}</a>`).join(" · ")}</div>`:""}<div class="knoppen" style="margin-bottom:12px"><button class="knop klein" data-oef="${tp.id}">Oefen dit onderwerp</button></div></details>`});
 h+=`<details><summary>Alle BE-video's van het kanaal</summary><ul>${Object.entries(VIDS).map(([v,n])=>`<li><a href="https://www.youtube.com/watch?v=${v}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join("")}</ul></details>`;
 app.innerHTML=h;app.querySelectorAll("[data-oef]").forEach(b=>b.onclick=()=>{ST.focus=[b.dataset.oef];save();tab("oefen")})}
function toonMeer(){stopSpraak();const ai=!!ST.settings.gk;
 app.innerHTML=`<div class="kaart"><b>Inspreken</b><p class="klein">${SR?"Je browser ondersteunt inspreken met de knop 🎤.":"Deze browser heeft geen inspreek-functie in de app. Gebruik de microfoon op je toetsenbord in het tekstvak."}</p></div>
 <div class="kaart"><b>AI-nakijken van open vragen</b><p class="klein">${ai?"Staat aan (Gemini). Je ingesproken antwoord gaat naar Google om na te kijken.":"Staat uit. De app kijkt dan zelf na op kernwoorden en volgorde."}</p>
 ${ai?`<button class="knop klein" id="aiTest">Test AI</button><button class="knop licht klein" id="aiUit">Zet uit</button>`:""}<div id="aiRes" class="klein"></div></div>
 <div class="kaart"><b>Hoe werkt het drillen?</b><p class="klein">Elke vraag heeft vijf bolletjes. Goed = een bolletje erbij en de vraag komt later pas terug; fout = terug naar nul en hij komt binnen een paar vragen terug. Bij drie bolletjes (drie keer goed, met tijd ertussen) telt een vraag als beheerst. Nieuwe vragen komen er pas bij als de wankele vragen weer staan. Rekensommen krijgen steeds nieuwe getallen.</p></div>
 <div class="kaart"><b>Voortgang</b><p class="klein">Wordt bewaard op dit toestel, in deze browser.</p><button class="knop oranje klein" id="reset">Alles op nul zetten</button></div>`;
 const t=$("#aiTest");if(t)t.onclick=async()=>{$("#aiRes").textContent="Bezig…";const it=ITEMS.find(i=>i.id==="f2");const r=await aiNakijken(it,"motor uit en verlichting uit, aanhanger naar achteren duwen, handrem erop, neuswiel omlaag, stekker eruit, losbreekkabel eraf en dan van de kogel tillen");$("#aiRes").textContent=r&&!r.fout?`Werkt. Oordeel: ${r.goed?"goed":"fout"}. ${r.feedback||""}`:(r?r.fout:"geen sleutel")};
 const u=$("#aiUit");if(u)u.onclick=()=>{delete ST.settings.gk;save();toonMeer()};
 $("#reset").onclick=()=>{if(confirm("Alle voortgang wissen?")){ST={items:{},n:0,log:[],settings:ST.settings,focus:[]};save();toonMeer();kopBalk()}}}
function tab(n){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("aan",b.dataset.tab===n));if(n!=="oefen")examen=null;({oefen:toonOefenen,stand:toonStand,leer:toonLeer,meer:toonMeer})[n]()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
window.__be={ITEMS,TOPICS,FIG,lokaalNakijken,maakConcreet,renderVraag,kiesVolgende,grade,ST:()=>ST};
tab("oefen");
</script>
</body>
</html>
